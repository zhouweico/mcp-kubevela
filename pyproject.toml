[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-kubevela"
version = "0.3.0"
description = "MCP Server for KubeVela application delivery platform (VelaUX REST API)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "zhouweico" }
]
keywords = ["mcp", "model-context-protocol", "kubevela", "velaux", "oam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx2>=1.0.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.27.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/zhouweico/mcp-kubevela"
Repository = "https://github.com/zhouweico/mcp-kubevela"

[project.scripts]
mcp-kubevela = "mcp_kubevela.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_kubevela"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
